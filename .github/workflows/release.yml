# After CI passes on main, publishes ready-to-run Docker images to GitHub Container Registry (ghcr.io),
# for both normal servers (amd64) and ARM servers (arm64, e.g. Oracle Cloud Ampere). The server then only pulls them.
# بعد ما ينجح CI على main، ينشر صور Docker جاهزة في سجل حاويات GitHub (ghcr.io)،
# للسيرفرات العادية (amd64) وسيرفرات ARM (arm64، مثل Oracle Cloud Ampere). والسيرفر بعدها يسحبها بس.
name: Release images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Manual run from the Actions tab, e.g. to republish after deleting a package.
  # تشغيل يدوي من تبويب Actions، مثلًا لإعادة النشر بعد حذف حزمة.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # Only a green CI run of a push to main (not a pull request) ships images.
    # فقط تشغيل CI ناجح لـ push على main (مو pull request) ينشر الصور.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        part: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          # Build exactly the commit CI tested, not whatever main points to now.
          # نبني نفس الـ commit اللي اختبره CI بالضبط، مو آخر شي في main الحين.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Registry names must be lowercase, but the GitHub owner name has capitals.
      # أسماء السجل لازم تكون بأحرف صغيرة، واسم المالك في GitHub فيه أحرف كبيرة.
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.part }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.part }}
          platforms: linux/amd64,linux/arm64
          push: true
          # "latest" is what the server pulls; the commit tag allows rolling back to an exact version.
          # "latest" هو اللي يسحبه السيرفر؛ وتاج الـ commit يسمح بالرجوع لنسخة محددة.
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.event.workflow_run.head_sha || github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.part }}
          cache-to: type=gha,mode=max,scope=${{ matrix.part }}
