spring:
  application:
    name: masar-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/masar}
    username: ${DB_USERNAME:masar}
    password: ${DB_PASSWORD:masar}
  jackson:
    deserialization:
      # Treat a missing primitive field (e.g. "active") as its default instead of rejecting the whole request.
      # نعتبر الحقل الأساسي الناقص (مثل "active") بقيمته الافتراضية بدل رفض الطلب كامل.
      fail-on-null-for-primitives: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    web:
      pageable:
        # Caps ?size= so a client cannot request millions of rows in one call.
        # يحدّ ?size= حتى ما يطلب العميل ملايين الصفوف في طلب واحد.
        max-page-size: 100

server:
  port: ${PORT:8080}
  # Trust X-Forwarded-For only from internal proxies (nginx in the same Docker network), so the rate limiter
  # sees the real visitor IP and a visitor cannot fake it by sending the header directly.
  # نثق بـ X-Forwarded-For فقط من البروكسي الداخلي (nginx في نفس شبكة Docker)، فيشوف محدّد الطلبات عنوان الزائر الحقيقي
  # وما يقدر الزائر يزوّره بإرسال الترويسة بنفسه.
  forward-headers-strategy: native
  error:
    include-message: never

masar:
  jwt:
    # Must be at least 32 characters. Always override JWT_SECRET outside local development.
    secret: ${JWT_SECRET:local-dev-secret-change-me-please-0123456789}
    expiration: ${JWT_EXPIRATION:8h}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  time-zone: Asia/Riyadh
  seed:
    # Creates demo users and sample data on an empty database.
    enabled: ${SEED_DEMO_DATA:true}
    admin-password: ${ADMIN_PASSWORD:Admin@12345}
    staff-password: ${STAFF_PASSWORD:Staff@12345}
  # Limits for the public (no login) endpoints, per visitor IP, to stop spam bookings and phone guessing.
  # حدود الروابط العامة (بدون دخول) لكل عنوان IP، لمنع الحجوزات المزعجة وتخمين أرقام الجوال.
  rate-limit:
    window: 10m
    bookings: ${RATE_LIMIT_BOOKINGS:5}
    lookups: ${RATE_LIMIT_LOOKUPS:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
