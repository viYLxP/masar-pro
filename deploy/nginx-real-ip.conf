# Mounted into each frontend's nginx in production only. Requests reach nginx only through Caddy on the private
# Docker network, so nginx trusts X-Forwarded-For from private addresses and uses it as the visitor IP ($remote_addr).
# يُركّب في nginx الخاص بكل فرونت في الإنتاج فقط. الطلبات توصل nginx عن طريق Caddy في شبكة Docker الخاصة بس،
# فـ nginx يثق بـ X-Forwarded-For من العناوين الخاصة ويعتبره عنوان الزائر ($remote_addr).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
