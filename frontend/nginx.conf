# Serves the Angular build and forwards /api to the backend container, so the browser sees one origin (no CORS needed).
# يقدّم ملفات Angular ويحوّل /api لحاوية الباكند، فالمتصفح يشوف مصدر واحد (بدون حاجة لـ CORS).

# Hashed bundles never change, so browsers may cache them for a year; index.html must always be revalidated.
# الملفات المرقّمة بالـ hash ما تتغير أبدًا فيُسمح بحفظها سنة؛ أما index.html فلازم يتحقق منه المتصفح كل مرة.
# A map is used instead of add_header inside each location, because nginx drops server-level add_header
# directives in any location that defines its own add_header.
# نستخدم map بدل add_header داخل كل location، لأن nginx يتجاهل ترويسات الـ server في أي location فيه add_header خاص.
map $uri $cache_control {
  ~*\.(js|css|woff2?|svg)$ "public, max-age=31536000, immutable";
  default "no-cache";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Basic hardening headers. / ترويسات حماية أساسية.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Cache-Control $cache_control;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    # nginx is the edge, so it overwrites (not appends) X-Forwarded-For with the real visitor address.
    # The API's per-IP rate limit reads it; an appended header would let a visitor fake their IP.
    # nginx هو الواجهة، فيكتب X-Forwarded-For من جديد (بدون إضافة) بعنوان الزائر الحقيقي.
    # حد الطلبات لكل IP في الـ API يقرأه؛ والإضافة كانت بتخلي الزائر يزوّر عنوانه.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Swagger UI and its OpenAPI JSON, handy for reviewers. / واجهة Swagger وملف OpenAPI، مفيدة للمراجعين.
  location ~ ^/(swagger-ui|v3/api-docs) {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
  }

  # SPA fallback: unknown paths (e.g. /app/requests/12 after a refresh) load index.html and the router takes over.
  # A missing bundle file still returns 404 instead of HTML, which would break the JS parser silently.
  # بديل التطبيق أحادي الصفحة: المسارات غير الموجودة (مثل /app/requests/12 بعد التحديث) تحمّل index.html والراوتر يتولى.
  # أما ملف حزمة مفقود فيرجّع 404 بدل HTML، لأن HTML بمكان JS يكسر التطبيق بصمت.
  location ~* \.(js|css|woff2?|svg|ico|png)$ {
    try_files $uri =404;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
