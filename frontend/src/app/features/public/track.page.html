<div class="page-narrow">
  @if (view(); as v) {
    <app-customer-request
      [view]="v"
      [busy]="busy()"
      [error]="errorText()"
      (accepted)="accept()"
      (rejected)="reject($event)"
      (paid)="pay($event)"
      (refreshed)="refresh()"
    >
      <button type="button" class="btn" (click)="reset()">{{ 'track.another' | t }}</button>
    </app-customer-request>
  } @else {
    <header class="page-header page-header--center">
      <div>
        <h1>{{ 'track.title' | t }}</h1>
        <p>{{ 'track.subtitle' | t }}</p>
      </div>
    </header>
    <form class="card track-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      @if (errorText(); as message) {
        <div class="alert alert--danger" role="alert" data-testid="track-error">{{ message }}</div>
      }
      <div class="field">
        <label for="t-ref">{{ 'track.reference' | t }}</label>
        <input
          id="t-ref"
          formControlName="reference"
          dir="ltr"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
          maxlength="20"
          [placeholder]="'track.referencePlaceholder' | t"
          aria-describedby="t-ref-err"
        />
        <app-field-error [control]="form.controls.reference" id="t-ref-err" />
      </div>
      <div class="field">
        <label for="t-phone">{{ 'track.phone' | t }}</label>
        <input
          id="t-phone"
          type="tel"
          inputmode="tel"
          formControlName="phone"
          dir="ltr"
          maxlength="20"
          autocomplete="tel"
          placeholder="05XXXXXXXX"
          aria-describedby="t-phone-err"
        />
        <app-field-error [control]="form.controls.phone" id="t-phone-err" />
      </div>
      <button
        type="submit"
        class="btn btn--primary btn--block"
        [disabled]="busy()"
        data-testid="track-submit"
      >
        {{ (busy() ? 'track.searching' : 'track.submit') | t }}
      </button>
      @if (!auth.token()) {
        <p class="hint">
          {{ 'track.accountHint' | t }}
          <a routerLink="/register">{{ 'site.register' | t }}</a>
        </p>
      }
    </form>
  }
</div>
