# Render Blueprint: the Masar Pro API on Render's free plan, from the image CI publishes to ghcr.io.
# بلوبرنت Render: واجهة Masar Pro البرمجية على الخطة المجانية، من الصورة اللي ينشرها CI في ghcr.io.
#
# Steps / الخطوات: Render dashboard -> New -> Blueprint -> pick this repo. Render asks only for the three database values
# (from Supabase, see masar-pro/deploy/vercel-render-supabase.md); every secret below is generated by Render itself.
# لوحة Render -> New -> Blueprint -> اختر هذا المستودع. يسألك Render عن قيم قاعدة البيانات الثلاث فقط (من Supabase)؛
# وكل الأسرار تحت يولّدها Render بنفسه.
services:
  - type: web
    name: masar-pro-api
    runtime: image
    image:
      url: ghcr.io/viylxp/masar-pro-backend:latest
    plan: free
    # Frankfurt is the closest Render region to Saudi Arabia (there is no Middle East region). Fixed after creation.
    # فرانكفورت أقرب منطقة في Render للسعودية (ما فيه منطقة بالشرق الأوسط). ما تتغير بعد الإنشاء.
    region: frankfurt
    healthCheckPath: /actuator/health
    envVars:
      # Session-mode pooler of Supabase (port 5432, IPv4), one schema per app so one free Supabase project holds all three:
      #   jdbc:postgresql://<pooler-host>:5432/postgres?sslmode=require&currentSchema=masar
      # مجمّع Supabase بوضع session (المنفذ 5432، IPv4)، وschema لكل تطبيق فيكفي مشروع Supabase مجاني واحد للثلاثة.
      - key: DB_URL
        sync: false
      # postgres.<project-ref>  /  postgres.<رمز-المشروع>
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Flyway creates the schema on first start and keeps its tables there.
      # Flyway ينشئ الـ schema أول تشغيل ويحط جداوله فيه.
      - key: SPRING_FLYWAY_SCHEMAS
        value: masar
      - key: JWT_SECRET
        generateValue: true
      # Private admin password: read it in this service's Environment tab after the first deploy.
      # كلمة مرور المدير الخاصة: تقراها من تبويب Environment لهذي الخدمة بعد أول نشر.
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SEED_DEMO_DATA
        value: "true"
      - key: STAFF_PASSWORD
        value: Staff@12345
      - key: CUSTOMER_PASSWORD
        value: Customer@12345
      # The browser talks to Vercel, which forwards /api here. These must be the Vercel address of this app
      # (change them if Vercel gave your project a different name).
      # المتصفح يكلم Vercel وهو يحوّل /api هنا. لازم تكون عنوان Vercel لهذا التطبيق (غيّرها لو Vercel سمّى مشروعك باسم ثاني).
      - key: PUBLIC_URL
        value: https://masar-pro.vercel.app
      - key: CORS_ORIGINS
        value: https://masar-pro.vercel.app
      - key: CARD_PAYMENT_PROVIDER
        value: SANDBOX
      # Every visitor reaches the API through Vercel's few server addresses, so the per-IP anti-spam limits would count all
      # visitors together; they are raised here for that reason.
      # كل الزوار يوصلون الـ API عبر عناوين Vercel القليلة، فحدود منع الإزعاج لكل IP كانت بتحسبهم كلهم مع بعض؛ لذلك رفعناها هنا.
      - key: RATE_LIMIT_BOOKINGS
        value: "300"
      - key: RATE_LIMIT_LOOKUPS
        value: "600"
      # Smaller, faster JVM for the free plan's 0.1 CPU: C1 compiler only, serial GC, lazy bean creation.
      # JVM أصغر وأسرع لمعالج الخطة المجانية (0.1): مترجم C1 فقط، وGC تسلسلي، وإنشاء الـ beans عند الحاجة.
      - key: JAVA_TOOL_OPTIONS
        value: -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xss512k -XX:CICompilerCount=1
      - key: SPRING_MAIN_LAZY_INITIALIZATION
        value: "true"
